// 全局键盘：Escape / Delete / Ctrl+S / Ctrl+C / Ctrl+V
document.addEventListener('keydown', function(e) {
  var tag = (e.target.tagName || '').toLowerCase();
  var isInput = (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable);

  // Delete/Backspace: 批量清空选区
  if ((e.key === 'Delete' || e.key === 'Backspace') && !isInput && selRange) {
    e.preventDefault();
    batchClearRange();
    return;
  }

  // Delete/Backspace: 清空单个选中单元格（非编辑状态）
  if ((e.key === 'Delete' || e.key === 'Backspace') && !isInput && !editingCell && lastTd && lastTd.classList.contains('editable') && !selRange) {
    e.preventDefault();
    var _tr = lastTd.closest('tr');
    if (!_tr) return;
    var _rowIdx = parseInt(_tr.dataset.row);
    var _col = parseInt(lastTd.dataset.col);
    if (isNaN(_rowIdx) || isNaN(_col)) return;
    var _src = getSourceArray();
    if (!_src || !_src[_rowIdx]) return;
    var _oldVal = _src[_rowIdx][_col];
    if (_oldVal === '' || _oldVal === undefined || _oldVal === null) { toast('单元格已为空', 'info'); return; }
    _src[_rowIdx][_col] = '';
    markDirty();
    scheduleAutoSync();
    // 更新单元格显示
    lastTd.textContent = '';
    updateHeaderStats();
    // 如果当前在数据看板页面，实时刷新看板
    if (activeTab === 'dashboard') renderDashboard();
    toast('已清空单元格', 'info');
    return;
  }

  // Ctrl+C: 批量复制选区 / 单单元格复制
  if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !isInput) {
    e.preventDefault();
    if (selRange) {
      // 批量复制选区为 TSV
      batchCopyRange();
    } else if (lastTd) {
      // 单单元格复制
      var text = (lastTd.querySelector('.badge')?.textContent || lastTd.textContent || '').trim();
      if (text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() { toast('已复制', 'info'); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
          toast('已复制', 'info');
        }
      }
    }
    return;
  }

  // Ctrl+V: 批量粘贴 / 单格粘贴
  if ((e.ctrlKey || e.metaKey) && e.key === 'v' && !isInput) {
    e.preventDefault();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(text) {
        if (!text) return;
        // 检测是否含换行/制表符 → 批量粘贴
        if (text.indexOf('\n') >= 0 || text.indexOf('\t') >= 0) {
          batchPasteRange(text);
        } else if (lastTd && lastTd.classList.contains('editable')) {
          startEdit(lastTd);
          setTimeout(function() {
            var inp = lastTd.querySelector('input');
            if (inp) { inp.value = text; inp.select(); }
          }, 50);
        }
      });
    }
    return;
  }

  // Escape: 关闭弹窗 / 取消选区
  if (e.key === 'Escape') {
    var modal = document.getElementById('addLeadModal');
    if (modal) { closeAddLeadModal(); return; }
    var colModal = document.getElementById('addColumnModal');
    if (colModal) { closeAddColumnModal(); return; }
    if (selRange) { clearRangeSelection(); toast('已取消选区', 'info'); return; }
  }

  // Enter: 选中单元格时进入编辑（非编辑状态）
  if (e.key === 'Enter' && !isInput && !editingCell && lastTd && lastTd.classList.contains('editable')) {
    e.preventDefault();
    startEdit(lastTd);
    return;
  }

  // F2: 进入编辑
  if (e.key === 'F2' && !isInput && !editingCell && lastTd && lastTd.classList.contains('editable')) {
    e.preventDefault();
    startEdit(lastTd);
    return;
  }

  // Ctrl+S / Cmd+S: 保存
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (isDirty) manualSave();
  }
});

// Warn on leave with unsaved changes
window.addEventListener('beforeunload', function(e) {
  // Auto-collect contentEditable edits from flowchart/mql tabs
  if (activeTab === 'flowchart') collectFlowEdits();
  if (activeTab === 'mql-scoring') collectMQLEdits();
  if (isDirty) {
    saveData();
    e.preventDefault();
    e.returnValue = '您有未保存的修改，确定要离开吗？';
    return e.returnValue;
  }
});

// Delegated input listener for contentEditable fields → mark dirty
document.getElementById('mainContent').addEventListener('input', function(e) {
  if (e.target.hasAttribute('contenteditable')) {
    markDirty();
  }
});
</script>
