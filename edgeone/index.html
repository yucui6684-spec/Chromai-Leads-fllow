<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>科诺美(Chromai) · 线索跟进管理系统</title>
<style>
:root {
  --bg:#f0f2f7; --surface:#ffffff; --border:#dfe3ee;
  --text:#1a1d27; --text2:#5a5e72; --text3:#9499a8;
  --blue:#2563EB; --purple:#7F77DD; --green:#1D9E75; --lime:#639922; --amber:#BA7517;
  --red:#EF4444; --mql:#3B82F6; --sql:#8B5CF6; --raw:#6B7280;
  --font:'Segoe UI','Microsoft YaHei',sans-serif;
  --th-bg:#eef1f7;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0
}
header .brand{font-weight:700;font-size:16px;color:var(--blue)}
header .brand span{color:var(--text2);font-weight:400;font-size:13px;margin-left:8px}
header .actions{display:flex;gap:8px;align-items:center}
header .stats{font-size:12px;color:var(--text3)}
header .stats b{color:var(--text)}
button{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-family:var(--font)
}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#2d6fc4}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.small{padding:3px 8px;font-size:11px}
button.dirty-btn{background:#BA7517;border-color:#BA7517;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.tabs{
  display:flex;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;flex-shrink:0;gap:0
}
.tab{
  padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text2);
  border-bottom:2px solid transparent;transition:all .15s;
  white-space:nowrap
}
.tab:hover{color:var(--text);border-bottom-color:var(--text3)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.main{flex:1;overflow:auto;padding:16px}

/* KPI */
.kpi-row{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px
}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 12px;text-align:center;box-shadow:var(--shadow)
}
.kpi-card .val{font-size:26px;font-weight:700;line-height:1.2}
.kpi-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.kpi-card .sub{font-size:10px;color:var(--text3);margin-top:2px}
.kpi-card.tot .val{color:var(--blue)}
.kpi-card.fol .val{color:var(--green)}
.kpi-card.raw .val{color:var(--raw)}
.kpi-card.mql .val{color:var(--mql)}
.kpi-card.sq .val{color:var(--sql)}
.kpi-card.lst .val{color:var(--red)}

/* Panels */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow)
}
.panel .title{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--border);padding:5px 7px;text-align:left}
th{background:var(--th-bg);color:var(--text2);font-weight:600;font-size:11px;position:sticky;top:0;z-index:1}
tr:hover td{background:rgba(55,138,221,.06)}
td{word-break:break-all}
/* Column & Row resize */
.col-resize-handle{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;background:transparent;transition:background .15s}
.col-resize-handle:hover,.col-resize-handle.active{background:var(--blue)}
.row-resize-handle{position:absolute;left:0;right:0;bottom:-1px;height:5px;cursor:row-resize;z-index:5;background:transparent;transition:background .15s}
.row-resize-handle:hover,.row-resize-handle.active{background:var(--blue)}
body.col-resizing,body.col-resizing *{cursor:col-resize!important;user-select:none!important}
body.row-resizing,body.row-resizing *{cursor:row-resize!important;user-select:none!important}
th{position:relative}
td{position:relative}


/* Inline edit */
td.editable{cursor:pointer;transition:background .15s}
td.editable:hover{background:rgba(55,138,221,.1)!important}
td.cell-selected{outline:2px solid #378ADD;outline-offset:-2px;background:rgba(55,138,221,.08)!important}
td.range-selected{outline:2px solid #378ADD;outline-offset:-2px;background:rgba(55,138,221,.15)!important;position:relative;z-index:1}
td.range-anchor{outline:2px solid #639922;outline-offset:-2px;background:rgba(99,153,34,.12)!important;position:relative;z-index:2}
td.editing{padding:0}
td.editing input,td.editing select{
  width:100%;height:100%;min-height:26px;background:var(--bg);border:2px solid var(--blue);
  color:var(--text);font-size:12px;font-family:var(--font);padding:2px 4px;outline:none
}
a.lead-link:hover{background:rgba(55,138,221,.15);border-radius:3px}

/* Editable fields (flowchart & MQL tabs) */
.flow-wrap [contenteditable],.mql-wrap [contenteditable]{outline:none;border-radius:4px;transition:background .15s,border-color .15s;padding:1px 4px;margin:-1px -4px}
.flow-wrap [contenteditable]:hover,.mql-wrap [contenteditable]:hover{background:rgba(55,138,221,.10);cursor:text}
.flow-wrap [contenteditable]:focus,.mql-wrap [contenteditable]:focus{background:rgba(55,138,221,.15);box-shadow:0 0 0 2px rgba(55,138,221,.4)}
.mql-table td[contenteditable]{border:1px solid var(--border)}
.mql-table td[contenteditable]:focus{border-color:var(--blue);background:rgba(55,138,221,.08)}
.ed-hint{font-size:11px;color:var(--text3);background:rgba(55,138,221,.08);border:1px dashed rgba(55,138,221,.3);border-radius:6px;padding:6px 12px;margin-bottom:14px}

/* Column management */
th .col-del{display:inline-block;margin-left:4px;color:var(--red);cursor:pointer;font-size:10px;opacity:.5;transition:opacity .15s}
th .col-del:hover{opacity:1}
.th-edit{outline:none;border-radius:3px;padding:1px 3px;margin:-1px -3px;cursor:text;transition:background .15s}
.th-edit:hover{background:rgba(55,138,221,.12)}
.th-edit:focus{background:rgba(55,138,221,.18);box-shadow:0 0 0 2px rgba(55,138,221,.4)}

/* Flow Chart */
.flow-wrap{max-width:900px;margin:0 auto;padding:8px 0 20px}
.flow-wrap h2{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--text)}
.flow-wrap .sub{font-size:12px;color:var(--text3);margin-bottom:20px}
.flow{position:relative;padding:4px 0}
.flow::before{content:"";position:absolute;left:23px;top:28px;bottom:28px;width:2px;background:var(--border);z-index:0}
.phase-head{display:flex;align-items:center;gap:8px;margin:20px 0 10px 52px;position:relative;z-index:1}
.phase-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.phase-name{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.02em}
.stage{position:relative;margin:0 0 8px;z-index:1}
.stage-num{position:absolute;left:8px;top:10px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;z-index:2;border:2px solid var(--bg)}
.stage-card{margin-left:52px;background:var(--surface);border-radius:8px;padding:12px 16px;border:1px solid var(--border);border-left-width:3px;box-shadow:var(--shadow)}
.stg-title{font-size:14px;font-weight:500;margin:0 0 6px}
.flow-row{display:flex;gap:10px;margin:3px 0;font-size:12px;line-height:1.6}
.flow-row .lbl{color:var(--text3);flex:0 0 68px;font-size:11px}
.flow-row .val{color:var(--text);flex:1}
.flow-branch{margin:16px 0 0 52px;padding:12px 16px;border-radius:8px;border:1px solid var(--border);border-left:3px solid var(--amber);background:var(--surface);position:relative;z-index:1}
.flow-branch .stg-title{color:var(--amber)}
.flow-legend{margin-top:20px;display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--text2)}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.flow-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.flow-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}

/* MQL Scoring */
.mql-wrap{max-width:800px;margin:0 auto;padding:8px 0 20px}
.mql-wrap h2{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--text)}
.mql-wrap .sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.mql-dim{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.mql-dim-head{padding:10px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.mql-dim-head .dim-icon{font-size:16px}
.mql-dim-head .dim-score{margin-left:auto;font-size:12px;color:var(--text3)}
.mql-table{width:100%;border-collapse:collapse;font-size:12px}
.mql-table th,.mql-table td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.mql-table th{background:var(--th-bg);color:var(--text2);font-weight:600;font-size:11px}
.mql-table td{word-break:break-all}
.mql-table .score-cell{text-align:center;font-weight:600;color:var(--blue);width:60px}
.mql-total{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
.mql-total .total-val{font-size:28px;font-weight:700;color:var(--mql)}
.mql-total .total-lbl{font-size:12px;color:var(--text2);margin-top:4px}
.mql-total .total-hint{font-size:11px;color:var(--text3);margin-top:6px}
.mql-note{font-size:11px;color:var(--text3);margin-top:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px}

/* Badges */
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.badge-sql{background:rgba(139,92,246,.15);color:var(--sql)}
.badge-mql{background:rgba(59,130,246,.15);color:var(--mql)}
.badge-raw{background:rgba(107,114,128,.15);color:var(--raw)}
.badge-lost{background:rgba(239,68,68,.12);color:var(--red)}
.badge-won{background:rgba(29,158,117,.15);color:var(--green)}

/* Mini bar */
.mini-bar{display:inline-block;width:60px;height:6px;background:var(--border);border-radius:3px;vertical-align:middle;margin-right:4px}
.mini-bar-fill{height:100%;background:var(--blue);border-radius:3px}

/* Bar chart */
.bar-chart{margin:6px 0}
.bar-row{display:flex;align-items:center;margin:4px 0;gap:6px}
.bar-label{width:80px;text-align:right;font-size:11px;color:var(--text2);flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--border);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .3s}
.bar-val{width:55px;font-size:11px;text-align:left;color:var(--text);font-variant-numeric:tabular-nums}

/* Outcome grid */
.outcome-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.outcome-item{text-align:center;padding:8px;background:var(--th-bg);border-radius:6px}
.outcome-count{font-size:20px;font-weight:700;color:var(--text);display:block}
.outcome-label{font-size:11px;color:var(--text2)}

/* Add row form */
.add-form{display:flex;gap:6px;align-items:center;padding:8px 0;flex-wrap:wrap}
.add-form input,.add-form select{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:4px;font-size:12px;font-family:var(--font)
}
.add-form input:focus,.add-form select:focus{outline:none;border-color:var(--blue)}

/* Notification */
.toast{
  position:fixed;top:60px;right:20px;background:var(--green);color:#fff;
  padding:8px 16px;border-radius:6px;font-size:12px;z-index:999;
  animation:fadeIn .3s;pointer-events:none;box-shadow:var(--shadow)
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filter-row select,.filter-row input{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:4px;font-size:12px;font-family:var(--font)
}
.filter-row label{font-size:11px;color:var(--text2)}

/* Scroll */
.table-wrap{max-height:calc(100vh - 260px);overflow:auto;border:1px solid var(--border);border-radius:6px}
.table-wrap thead th{position:sticky;top:0;z-index:2}

/* dashboard grid */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-full{grid-column:1/-1}

.footer{text-align:center;font-size:10px;color:var(--text3);margin-top:10px}

/* Toast types */
.toast.info{background:var(--blue)}
.toast.warn{background:var(--amber)}
.toast.err{background:var(--red)}

/* Highlight recently changed */
.highlight td{animation:highlightFade 1.5s}
@keyframes highlightFade{0%{background:rgba(55,138,221,.3)}100%{background:transparent}}

/* Modal */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;  background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  animation:fadeIn .2s
}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;width:640px;max-height:85vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.15)
}
.modal-box h3{font-size:16px;margin-bottom:14px;color:var(--text)}
.modal-box .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-box .form-field{display:flex;flex-direction:column;gap:3px}
.modal-box .form-field.full{grid-column:1/-1}
.modal-box .form-field label{font-size:11px;color:var(--text2)}
.modal-box .form-field input,.modal-box .form-field select,.modal-box .form-field textarea{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:6px 8px;border-radius:4px;font-size:12px;font-family:var(--font)
}
.modal-box .form-field input:focus,.modal-box .form-field select:focus,.modal-box .form-field textarea:focus{outline:none;border-color:var(--blue)}
.modal-box .form-field textarea{resize:vertical;min-height:50px}
.modal-box .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ===== 密码保护覆盖层 ===== */
#pwdOverlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:linear-gradient(135deg,#f0f2f7 0%,#e3e8f0 100%);
  display:flex;align-items:center;justify-content:center;
}
#pwdOverlay .pwd-box{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.12);padding:40px 48px;text-align:center;
  max-width:380px;width:90%;
}
#pwdOverlay .pwd-logo{font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
#pwdOverlay .pwd-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
#pwdOverlay .pwd-input{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;
  font-size:15px;text-align:center;letter-spacing:2px;outline:none;
  background:var(--bg);color:var(--text);transition:border-color .2s;
}
#pwdOverlay .pwd-input:focus{border-color:var(--blue)}
#pwdOverlay .pwd-btn{
  width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;
  background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  transition:background .2s;
}
#pwdOverlay .pwd-btn:hover{background:#1d4ed8}
#pwdOverlay .pwd-err{color:var(--red);font-size:12px;margin-top:8px;display:none}
#pwdOverlay .pwd-hint{font-size:11px;color:var(--text3);margin-top:16px}
</style>
</head>
<body>

<!-- 密码保护覆盖层 -->
<div id="pwdOverlay">
  <div class="pwd-box">
    <div class="pwd-logo">科诺美 Chromai</div>
    <div class="pwd-sub">线索跟进管理系统 · 请输入密码访问</div>
    <input type="password" class="pwd-input" id="pwdInput" placeholder="请输入访问密码" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPwd()">
    <button class="pwd-btn" onclick="checkPwd()">进入系统</button>
    <div class="pwd-err" id="pwdErr">密码错误，请重新输入</div>
    <div class="pwd-hint">仅限授权人员访问 · 数据不可导出</div>
  </div>
</div>

<header>
  <div class="brand">科诺美 Chromai <span>线索跟进管理系统</span></div>
  <div class="stats">
    线索<b id="statLeads">0</b> · 已跟进<b id="statFollowed">0</b> · 待跟进<b id="statRaw">0</b> ·
    MQL<b id="statMQL">0</b> · 流失<b id="statLost">0</b> · 
    最后保存：<b id="saveTime">-</b> · 
    <span style="color:var(--text3);font-size:12px" id="syncStatus">连接服务器...</span>
  </div>
  <div class="actions">
    <button onclick="resetData()" class="danger small" title="清空本地修改，恢复初始数据">重置数据</button>

    <button onclick="manualSave()" class="primary" id="btnSave" title="保存所有修改到本地">💾 保存</button>
    <button onclick="showAddLeadForm()" title="在线索池中新增一条线索">+ 新增线索</button>
    <button onclick="addFollowup()" class="primary" title="为当前线索新增跟进记录">+ 新增跟进</button>
    <button onclick="showImportModal()" style="background:var(--purple);color:#fff" title="从CSV/Excel文件或粘贴数据导入">📥 导入数据</button>
  </div>
</header>

<div class="tabs" id="tabsContainer">
  <div class="tab active" data-tab="dashboard">数据看板</div>
  <div class="tab" data-tab="leads">线索池总表 (<span id="leadsCount">0</span>)</div>
  <div class="tab" data-tab="followups">跟进记录 (<span id="fupsCount">0</span>) <span id="fupMismatchWarn" style="display:none;color:#EF4444;font-size:10px"></span></div>
  <div class="tab" data-tab="flowchart">流程示意图</div>
  <div class="tab" data-tab="mql-scoring">MQL评分标准</div>
</div>
<div class="main" id="mainContent"></div>
<div id="toastContainer"></div>

<script>
// ============================================================
// 密码保护 & 防下载
// ============================================================
const ACCESS_PASSWORD = 'chromai2019';
const PWD_KEY = 'chromai_access_granted';

function checkPwd() {
  var input = document.getElementById('pwdInput');
  var err = document.getElementById('pwdErr');
  if (input.value === ACCESS_PASSWORD) {
    sessionStorage.setItem(PWD_KEY, '1');
    var overlay = document.getElementById('pwdOverlay');
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity .3s';
    setTimeout(function(){ overlay.style.display = 'none'; }, 300);
    // 启动系统
    init();
  } else {
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

// 防止右键菜单
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
// 防止 Ctrl+S / Ctrl+U / F12 / Ctrl+Shift+I
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && (e.key==='s' || e.key==='S' || e.key==='u' || e.key==='U')) { e.preventDefault(); return false; }
  if (e.key==='F12') { e.preventDefault(); return false; }
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && (e.key==='I'||e.key==='i')) { e.preventDefault(); return false; }
});
// 禁用文本选择和拖拽
document.addEventListener('selectstart', function(e){
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.isContentEditable) e.preventDefault();
});
document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });

// 页面加载时检查密码
(function(){
  // 自动聚焦密码输入框
  setTimeout(function(){ document.getElementById('pwdInput').focus(); }, 100);
})();

// ============================================================
// 数据加载
// ============================================================
const STORAGE_KEY = 'chromai_leads_v13';
// 同源 API 优先；静态托管站点（CloudStudio等）指向 Railway 后端实现数据同步
const _STATIC_HOSTS = ['agentos-app.net', 'workbuddy.link', 'vercel.app', 'github.io'];
const API_BASE = _STATIC_HOSTS.some(hn => location.hostname.includes(hn)) ? 'https://chromai-leads-fllow-production.up.railway.app' : '';

let lastServerModified = 0;  // 服务器数据最后修改时间戳（用于检测他人更新）

let autoSyncTimer = null;  // 自动同步定时器（debounce）

// ---- 自动同步（编辑后 2 秒自动推送）----
function scheduleAutoSync() {
  if (autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function() {
    autoSyncTimer = null;
    saveData();
    syncToServer();
  }, 2000);
}

// ---- 服务器同步：拉取 ----
async function syncFromServer() {
  if (!SYNC_ENABLED) return false;
  // 推送后 8 秒内不拉取，防止 Blob 存储最终一致性导致旧数据覆盖
  if (lastPushTime && (Date.now() - lastPushTime < 8000)) {
    var syncElP = document.getElementById('syncStatus');
    if (syncElP) syncElP.textContent = '🟢 同步保护中 ' + Math.ceil((8000 - (Date.now() - lastPushTime)) / 1000) + 's';
    return false;
  }
  try {
    const [leadsRes, fupsRes, flowRes, mqlRes] = await Promise.all([
      fetch(API_BASE + '/api/leads').then(r => r.json()).catch(() => null),
      fetch(API_BASE + '/api/followups').then(r => r.json()).catch(() => null),
      fetch(API_BASE + '/api/flowchart').then(r => r.json()).catch(() => null),
      fetch(API_BASE + '/api/mql').then(r => r.json()).catch(() => null)
    ]);

    let updated = false;

    if (leadsRes && Array.isArray(leadsRes.data) && leadsRes.data.length > 0) {
      leadsData = leadsRes.data;
      if (leadsRes.headers && leadsRes.headers.length > 0) LEADS_HEADERS = leadsRes.headers;
      updated = true;
    }
    if (fupsRes && Array.isArray(fupsRes.data) && fupsRes.data.length > 0) {
      fupsData = fupsRes.data;
      if (fupsRes.headers && fupsRes.headers.length > 0) FUP_HEADERS = fupsRes.headers;
      updated = true;
    }
    if (flowRes && flowRes.data) {
      if (flowRes.data.stages) flowStages = flowRes.data.stages;
      if (flowRes.data.phases) flowPhases = flowRes.data.phases;
      if (flowRes.data.branch) flowBranch = flowRes.data.branch;
      if (flowRes.data.title) flowTitle = flowRes.data.title;
      if (flowRes.data.subtitle) flowSubtitle = flowRes.data.subtitle;
      if (flowRes.data.footer) flowFooter = flowRes.data.footer;
      updated = true;
    }
    if (mqlRes && mqlRes.data) {
      if (mqlRes.data.dimensions) mqlDimensions = mqlRes.data.dimensions;
      if (mqlRes.data.title) mqlTitle = mqlRes.data.title;
      if (mqlRes.data.subtitle) mqlSubtitle = mqlRes.data.subtitle;
      if (mqlRes.data.totalVal) mqlTotalVal = mqlRes.data.totalVal;
      if (mqlRes.data.totalLbl) mqlTotalLbl = mqlRes.data.totalLbl;
      if (mqlRes.data.totalHint) mqlTotalHint = mqlRes.data.totalHint;
      if (mqlRes.data.note) mqlNote = mqlRes.data.note;
      updated = true;
    }

    if (updated) {
      lastSyncTime = Date.now();
      serverOnline = true;
      // 同时更新本地缓存
      saveData();
      // 获取服务器版本戳，作为后续轮询比对的基线
      try {
        const info = await fetch(API_BASE + '/api/status').then(r => r.json());
        if (info && info.lastModified) lastServerModified = info.lastModified;
      } catch(e2) {}
    }
    // 更新同步状态
    var syncEl = document.getElementById('syncStatus');
    if (syncEl) syncEl.textContent = serverOnline ? '🟢 实时同步' : '🟡 本地模式';
    return updated;
  } catch(e) {
    console.warn('服务器同步失败，使用本地数据:', e.message);
    serverOnline = false;
    var syncEl2 = document.getElementById('syncStatus');
    if (syncEl2) syncEl2.textContent = '🟡 本地模式';
    return false;
  }
}

// ---- 服务器同步：推送 ----
async function syncToServer() {
  if (!SYNC_ENABLED) return;
  try {
    const payload = {
      leads: leadsData, fups: fupsData,
      leadsHeaders: LEADS_HEADERS, fupHeaders: FUP_HEADERS,
      flowStages, flowPhases, flowBranch, flowTitle, flowSubtitle, flowFooter,
      mqlDimensions, mqlTitle, mqlSubtitle, mqlTotalVal, mqlTotalLbl, mqlTotalHint, mqlNote
    };

    const responses = await Promise.all([
      fetch(API_BASE + '/api/leads', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data: leadsData, headers: LEADS_HEADERS })
      }),
      fetch(API_BASE + '/api/followups', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data: fupsData, headers: FUP_HEADERS })
      }),
      fetch(API_BASE + '/api/flowchart', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data: { stages: flowStages, phases: flowPhases, branch: flowBranch, title: flowTitle, subtitle: flowSubtitle, footer: flowFooter } })
      }),
      fetch(API_BASE + '/api/mql', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data: { dimensions: mqlDimensions, title: mqlTitle, subtitle: mqlSubtitle, totalVal: mqlTotalVal, totalLbl: mqlTotalLbl, totalHint: mqlTotalHint, note: mqlNote } })
      })
    ]);
    // 检查所有响应状态
    var allOk = responses.every(function(r) { return r.ok; });
    if (!allOk) throw new Error('部分API返回错误');
    lastSyncTime = Date.now();
    lastPushTime = Date.now(); // 记录推送时间，防止刷新时旧数据覆盖
    localStorage.setItem('chromai_lastPush', String(lastPushTime));
    // 更新本地版本戳，避免下一轮轮询触发不必要的全量拉取
    lastServerModified = Date.now();
    serverOnline = true;
    // 更新同步状态显示
    var syncEl = document.getElementById('syncStatus');
    if (syncEl) syncEl.textContent = '🟢 已同步 ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    console.warn('推送到服务器失败:', e.message);
    serverOnline = false;
    var syncEl = document.getElementById('syncStatus');
    if (syncEl) syncEl.textContent = '🟡 同步失败，已存本地';
  }
}

// ---- 轻量级版本检测轮询（每 5 秒检查 status，有变化才全量拉取）----
setInterval(function() {
  if (!SYNC_ENABLED || serverSyncing) return;
  // 推送保护期内跳过
  if (lastPushTime && (Date.now() - lastPushTime < 8000)) return;
  // 正在编辑单元格时不拉取（避免打断）
  if (editingCell) return;

  // 第一步：轻量级 status 检查（只返回 lastModified + 计数，不传大量数据）
  fetch(API_BASE + '/api/status').then(r => r.json()).then(function(info) {
    if (!info || !info.blobReady) return;
    serverOnline = true;
    var syncEl = document.getElementById('syncStatus');
    // 服务器返回的 lastModified 与本地不同 → 有人更新了数据
    if (info.lastModified && info.lastModified !== lastServerModified) {
      // 第二步：检测到变化，全量拉取数据
      serverSyncing = true;
      syncFromServer().then(function(updated) {
        serverSyncing = false;
        if (updated) {
          lastServerModified = info.lastModified;
          updateHeaderStats();
          if (!isDirty && !editingCell) {
            render();
            toast('🔄 检测到他人更新，已同步', 'info');
          } else {
            // 用户有未保存修改，只更新数据不刷新界面
            toast('📌 他人已更新数据，保存后可查看', 'info');
          }
        }
      }).catch(function() { serverSyncing = false; });
    } else if (syncEl) {
      syncEl.textContent = '🟢 实时同步';
    }
  }).catch(function() {
    serverOnline = false;
    var syncEl2 = document.getElementById('syncStatus');
    if (syncEl2) syncEl2.textContent = '🟡 本地模式';
  });
}, 5000);

let resizingCol = null;   // { tab, colIdx, startX, startW, th }

function bindResizeHandles() {
  // 列宽拖拽 —— 给每个 th 添加手柄
  document.querySelectorAll('.table-wrap thead th').forEach((th, colIdx) => {
    const old = th.querySelector('.col-resize-handle');
    if (old) old.remove();
    const handle = document.createElement('div');
    handle.className = 'col-resize-handle';
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const rect = th.getBoundingClientRect();
      resizingCol = {
        tab: activeTab === 'followups' ? 'followups' : 'leads',
        colIdx: colIdx,
        startX: e.clientX,
        startW: rect.width,
        th: th
      };
      document.body.classList.add('col-resizing');
      handle.classList.add('active');
    });
    th.appendChild(handle);
  });

  // 行高拖拽 —— 给每个 tr 添加手柄
  document.querySelectorAll('.table-wrap tbody tr').forEach(tr => {
    const old = tr.querySelector('.row-resize-handle');
    if (old) old.remove();
    const rowIdx = parseInt(tr.getAttribute('data-row'));
    if (isNaN(rowIdx)) return;
    const handle = document.createElement('div');
    handle.className = 'row-resize-handle';
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const rect = tr.getBoundingClientRect();
      resizingRow = {
        tab: activeTab === 'followups' ? 'followups' : 'leads',
        rowIdx: rowIdx,
        startY: e.clientY,
        startH: rect.height,
        tr: tr
      };
      document.body.classList.add('row-resizing');
      handle.classList.add('active');
    });
    tr.appendChild(handle);
  });

  applySavedSizes();
}

document.addEventListener('mousemove', function(e) {
  if (resizingCol) {
    const delta = e.clientX - resizingCol.startX;
    const newW = Math.max(40, resizingCol.startW + delta);
    const tabKey = resizingCol.tab;
    if (!colWidths[tabKey]) colWidths[tabKey] = {};
    colWidths[tabKey][resizingCol.colIdx] = newW;
    const table = document.querySelector('.table-wrap table');
    if (table) {
      const colgroup = table.querySelector('colgroup');
      if (colgroup && colgroup.children[resizingCol.colIdx]) {
        colgroup.children[resizingCol.colIdx].style.width = newW + 'px';
      }
    }
  }
  if (resizingRow) {
    const delta = e.clientY - resizingRow.startY;
    const newH = Math.max(22, resizingRow.startH + delta);
    const tabKey = resizingRow.tab;
    if (!rowHeights[tabKey]) rowHeights[tabKey] = {};
    rowHeights[tabKey][resizingRow.rowIdx] = newH;
    resizingRow.tr.style.height = newH + 'px';
    resizingRow.tr.querySelectorAll('td').forEach(td => { td.style.height = newH + 'px'; });
  }
});

document.addEventListener('mouseup', function() {
  if (resizingCol) {
    document.body.classList.remove('col-resizing');
    const h = resizingCol.th.querySelector('.col-resize-handle');
    if (h) h.classList.remove('active');
    resizingCol = null;
  }
  if (resizingRow) {
    document.body.classList.remove('row-resizing');
    const h = resizingRow.tr ? resizingRow.tr.querySelector('.row-resize-handle') : null;
    if (h) h.classList.remove('active');
    resizingRow = null;
  }
});

function applySavedSizes() {
  const tabKey = activeTab === 'followups' ? 'followups' : 'leads';
  const table = document.querySelector('.table-wrap table');
  if (!table) return;
  const widths = colWidths[tabKey] || {};
  const colgroup = table.querySelector('colgroup');
  if (colgroup) {
    Object.keys(widths).forEach(idx => {
      if (colgroup.children[idx]) colgroup.children[idx].style.width = widths[idx] + 'px';
    });
  }
  const heights = rowHeights[tabKey] || {};
  const tbody = table.querySelector('tbody');
  if (tbody) {
    Object.keys(heights).forEach(idx => {
      const tr = tbody.querySelector('tr[data-row="' + idx + '"]');
      if (tr) {
        tr.style.height = heights[idx] + 'px';
        tr.querySelectorAll('td').forEach(td => { td.style.height = heights[idx] + 'px'; });
      }
    });
  }
}

function initData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.leads && parsed.fups) {
        leadsData = parsed.leads;
        fupsData = parsed.fups;
        if (parsed.flowStages) flowStages = parsed.flowStages;
        if (parsed.flowPhases) flowPhases = parsed.flowPhases;
        if (parsed.flowBranch) flowBranch = parsed.flowBranch;
        if (parsed.flowTitle) flowTitle = parsed.flowTitle;
        if (parsed.flowSubtitle) flowSubtitle = parsed.flowSubtitle;
        if (parsed.flowFooter) flowFooter = parsed.flowFooter;
        if (parsed.mqlDimensions) mqlDimensions = parsed.mqlDimensions;
        if (parsed.mqlTitle) mqlTitle = parsed.mqlTitle;
        if (parsed.mqlSubtitle) mqlSubtitle = parsed.mqlSubtitle;
        if (parsed.mqlTotalVal) mqlTotalVal = parsed.mqlTotalVal;
        if (parsed.mqlTotalLbl) mqlTotalLbl = parsed.mqlTotalLbl;
        if (parsed.mqlTotalHint) mqlTotalHint = parsed.mqlTotalHint;
        if (parsed.mqlNote) mqlNote = parsed.mqlNote;
        if (parsed.leadsHeaders) LEADS_HEADERS = parsed.leadsHeaders;
        if (parsed.fupHeaders) FUP_HEADERS = parsed.fupHeaders;
        return true;
      }
    } catch(e) {
      console.warn('localStorage 数据损坏，已重置');
      localStorage.removeItem(STORAGE_KEY);
    }
  }
  return false;
}

// 同步跟进记录负责人 = 线索池负责人（去除大区总/经理等职务后缀）
function fixFupOwners() {
  var ownerMap = {};
  for (var i = 0; i < leadsData.length; i++) {
    var raw = (leadsData[i][13] || '').trim();
    // 去掉括号中的职务后缀，如 穆忠仁(大区总) -> 穆忠仁
    ownerMap[leadsData[i][0]] = raw.replace(/\(.*?\)/g, '').replace(/（.*?）/g, '').trim();
  }
  var fixed = 0;
  for (var j = 0; j < fupsData.length; j++) {
    var lid = fupsData[j][1];
    if (ownerMap[lid] !== undefined && fupsData[j][13] !== ownerMap[lid]) {
      fupsData[j][13] = ownerMap[lid];
      fixed++;
    }
  }
  return fixed;
}

function resetData() {
  if (!confirm('确定要重置所有数据为初始状态吗？你手动修改的内容将会丢失！')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    leads: leadsData, fups: fupsData,
    leadsHeaders: LEADS_HEADERS, fupHeaders: FUP_HEADERS,
    flowStages, flowPhases, flowBranch, flowTitle, flowSubtitle, flowFooter,
    mqlDimensions, mqlTitle, mqlSubtitle, mqlTotalVal, mqlTotalLbl, mqlTotalHint, mqlNote
  }));
  isDirty = false;
  const now = new Date().toLocaleTimeString('zh-CN');
  document.getElementById('saveTime').textContent = now;
  const btn = document.getElementById('btnSave');
  if (btn) { btn.textContent = '💾 保存'; btn.classList.remove('dirty-btn'); }
  updateHeaderStats();
}

function manualSave() {
  // Collect contentEditable edits from flowchart/mql tabs if active
  if (activeTab === 'flowchart') collectFlowEdits();
  if (activeTab === 'mql-scoring') collectMQLEdits();
  var synced = fixFupOwners();
  saveData();
  // 推送到服务器（多人协作共享）
  syncToServer();
  if (synced > 0) {
    toast('已保存，并同步 ' + synced + ' 条跟进记录负责人', 'info');
  } else {
    toast('数据已保存并同步', 'info');
  }
  // Re-render current tab to reflect updated subtotals etc.
  if (activeTab === 'flowchart' || activeTab === 'mql-scoring') render();
}

function markDirty() {
  if (!isDirty) {
    isDirty = true;
    const btn = document.getElementById('btnSave');
    if (btn) { btn.textContent = '💾 保存 *'; btn.classList.add('dirty-btn'); }
  }
}

};

function loadDefault() {
  if (typeof DEFAULT_DATA === 'string' && DEFAULT_DATA.startsWith('DATA_PLACEHOLDER')) return;
  if (DEFAULT_DATA.leads) leadsData = DEFAULT_DATA.leads;
  if (DEFAULT_DATA.fups) fupsData = DEFAULT_DATA.fups;
  saveData();
}

function updateHeaderStats() {
  const total = leadsData.length;
  const lost = leadsData.filter(r => (r[11]||'Raw') === '流失/回收').length;

  // 已跟进 / MQL = 转到跟进记录的线索数（去重，与数据看板一致）
  const fupIds = new Set();
  // 无采购需求 / 非目标客户 / 无效数据（判定无效，从待跟进中剔除）
  const noDemandIds = new Set();
  fupsData.forEach(r => {
    const lid = r[1] ? r[1].trim() : '';
    if (!lid) return;
    fupIds.add(lid);
    const ch = r[11] || '';
    if (ch.includes('无采购需求') || ch === '非目标客户' || ch === '无效数据') noDemandIds.add(lid);
  });
  const followed = fupIds.size;

  // 待跟进 = 跟进记录中去除无采购需求/非目标客户/无效数据后的线索（与数据看板一致）
  const pendingFups = followed - noDemandIds.size;

  // MQL = 转入跟进记录的线索数（与数据看板一致）
  const mql = fupIds.size;

  document.getElementById('statLeads').textContent = total;
  document.getElementById('statFollowed').textContent = followed;
  document.getElementById('statRaw').textContent = pendingFups;
  document.getElementById('statMQL').textContent = mql;
  document.getElementById('statLost').textContent = lost;
  document.getElementById('leadsCount').textContent = total;
  document.getElementById('fupsCount').textContent = fupsData.length;

  // 数据不匹配警告
  const warnEl = document.getElementById('fupMismatchWarn');
  if (warnEl) {
    if (fupsData.length > leadsData.length) {
      warnEl.style.display = 'inline';
      warnEl.textContent = `⚠ 跟进记录(${fupsData.length})多于线索(${total})，多出${fupsData.length - total}条，可点击"重置数据"恢复初始`;
    } else {
      warnEl.style.display = 'none';
    }
  }
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(tab) {
  // Collect contentEditable edits before switching away
  if (activeTab === 'flowchart') collectFlowEdits();
  if (activeTab === 'mql-scoring') collectMQLEdits();
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active');
  render();
}

document.getElementById('tabsContainer').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchTab(tab.dataset.tab);
});

// ============================================================
// 跟进记录 → 线索池跳转
// ============================================================
function jumpToLeadByIdx(idx) {
  var leadId = fupsData[idx] ? (fupsData[idx][1] || '') : '';
  if (!leadId) { toast('该跟进记录未关联线索编号', 'err'); return; }
  leadFilterId = leadId;
  leadFilterStage = '';
  leadFilterSales = '';
  leadFilterSource = ''; leadFilterRegion = ''; leadFilterScale = ''; leadFilterKeyword = '';
  switchTab('leads');
  toast('已跳转到线索：' + leadId, 'info');
  // 滚动到目标行并高亮
  setTimeout(function() {
    var tr = document.querySelector('.table-wrap tr[data-id="' + leadId + '"]');
    if (tr) {
      tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
      tr.classList.add('highlight');
      setTimeout(function() { tr.classList.remove('highlight'); }, 2500);
    }
  }, 100);
}

// ============================================================
// Toast 提示
// ============================================================
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2000);
}

// ============================================================
// 渲染
// ============================================================
function render() {
  // Preserve scroll position
  const wrap = document.querySelector('.table-wrap');
  const scrollTop = wrap ? wrap.scrollTop : 0;
  lastTd = null;  // DOM 已重建，清空旧引用
  selAnchor = null; selRange = null;

  updateHeaderStats();
  try {
    switch(activeTab) {
      case 'dashboard': renderDashboard(); break;
      case 'leads': renderLeads(); break;
      case 'followups': renderFollowups(); break;
      case 'flowchart': renderFlowChart(); break;
      case 'mql-scoring': renderMQLScoring(); break;
    }
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('mainContent').innerHTML =
      '<div class="panel" style="text-align:center;padding:40px">' +
      '<p style="color:var(--red);font-size:16px;margin-bottom:12px">渲染出错：' + h(e.message) + '</p>' +
      '<p style="color:var(--text3);font-size:13px;margin-bottom:16px">可能是浏览器本地存储数据损坏导致</p>' +
      '<button onclick="resetData()" class="primary">重置数据恢复</button>' +
      '</div>';
  }

  // Restore scroll position
  setTimeout(() => {
    const newWrap = document.querySelector('.table-wrap');
    if (newWrap && scrollTop > 0) newWrap.scrollTop = scrollTop;
  }, 50);
}

// ---- 数据看板 ----
function renderDashboard() {
  const total = leadsData.length;
  const st = {};
  leadsData.forEach(r => { const s = r[11] || 'Raw'; st[s] = (st[s] || 0) + 1; });
  const lost = st['流失/回收'] || 0;

  // 已跟进 = 有关联跟进记录的线索数（去重，新增跟进记录会自动计入）
  const followedLeadIds = new Set();
  fupsData.forEach(r => {
    const lid = r[1] ? r[1].trim() : '';
    if (lid) followedLeadIds.add(lid);
  });
  const followed = followedLeadIds.size;

  // ===== 业务口径统计 =====
  // MQL = 转到跟进记录的线索数
  const fupIds = new Set();
  // SQL = 明确有采购意向（跟进记录阶段变化=有采购需求）
  const demandIds = new Set();
  // 无采购需求 / 非目标客户 / 无效数据（判定无效，从待跟进中剔除）
  const noDemandIds = new Set();
  fupsData.forEach(r => {
    const lid = r[1] ? r[1].trim() : '';
    if (!lid) return;
    fupIds.add(lid);
    const ch = r[11] || '';
    if (ch === '有采购需求') demandIds.add(lid);
    if (ch.includes('无采购需求') || ch === '非目标客户' || ch === '无效数据') noDemandIds.add(lid);
  });
  const mql = fupIds.size;                  // MQL = 转到跟进记录的数据
  const sql = demandIds.size;               // SQL = 明确采购意向
  const pendingFups = mql - noDemandIds.size; // 待跟进 = 跟进记录中除无采购需求/非目标客户/无效数据外的线索

  // 全部线索阶段分布（互斥分组：流失 > SQL > MQL > 未跟进）
  const lostIds = new Set(leadsData.filter(r => (r[11]||'Raw') === '流失/回收').map(r => (r[0]||'').trim()).filter(Boolean));
  const stageDist = [
    { name:'Raw（未跟进）', color:'#6B7280', val: leadsData.filter(r => { const id=(r[0]||'').trim(); return !fupIds.has(id) && !lostIds.has(id); }).length },
    { name:'MQL（已跟进）', color:'#3B82F6', val: leadsData.filter(r => { const id=(r[0]||'').trim(); return fupIds.has(id) && !demandIds.has(id) && !lostIds.has(id); }).length },
    { name:'SQL（明确采购）', color:'#8B5CF6', val: leadsData.filter(r => { const id=(r[0]||'').trim(); return demandIds.has(id) && !lostIds.has(id); }).length },
    { name:'流失/回收', color:'#EF4444', val: lostIds.size }
  ];

  // ===== 过滤同业公司/其它（仅用于分析图表，KPI保留全量） =====
  const filteredLeads = leadsData.filter(r => {
    const ind = r[8] || '';
    return !ind.includes('同业') && !ind.includes('其它');
  });
  const filteredTotal = filteredLeads.length;

  // 线索编号 -> 线索数据 的查找表
  const leadMap = {};
  leadsData.forEach(r => { if (r[0]) leadMap[r[0].trim()] = r; });

  // 过滤后的跟进记录（排除关联到同业公司的记录）
  const filteredFups = fupsData.filter(r => {
    const lid = r[1] ? r[1].trim() : '';
    const lead = leadMap[lid];
    if (!lead) return false;
    const ind = lead[8] || '';
    return !ind.includes('同业') && !ind.includes('其它');
  });

  // ===== 跟进记录阶段变化全量分析 =====
  const changeMap = {};
  fupsData.forEach(r => {
    const change = r[11] || '未填写';
    changeMap[change] = (changeMap[change] || 0) + 1;
  });
  const sortedChange = Object.entries(changeMap).sort((a,b) => b[1] - a[1]);

  // 跟进分类
  const changeCategories = {
    '待跟进': ['待跟进','未填写','未联系上'],
    '培育中': ['继续沟通培养','待评估'],

    '无效/流失': ['无采购需求','非目标客户','无效数据','流失/回收-待评估']
  };

  // ===== 各销售跟进效果分析（基于跟进记录数据） =====
  const salesMap = {};
  filteredFups.forEach(r => {
    const sales = r[13] || '未分配';
    const change = r[11] || '未填写';
    if (!salesMap[sales]) salesMap[sales] = {tot:0, pending:0, nurture:0, demand:0, invalid:0};
    salesMap[sales].tot++;
    if (['待跟进','未联系上','未填写'].includes(change)) salesMap[sales].pending++;
    else if (['继续沟通培养','待评估'].includes(change)) salesMap[sales].nurture++;
    else if (change === '有采购需求') salesMap[sales].demand++;

  });
  const sortedSales = Object.entries(salesMap).sort((a,b)=>b[1].tot-a[1].tot);

  const regMap = {};
  filteredFups.forEach(r => {
    const lid = r[1] ? r[1].trim() : '';

    if (['待跟进','未联系上','未填写'].includes(change)) regMap[reg].pending++;

  const topFupInd = Object.entries(fupIndMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // ===== 活动来源分析（线索池总数 + 跟进记录数据） =====
  const actLeadsMap = {};
  filteredLeads.forEach(r => {
    const act = r[2] || '未知';
    const stage = r[11] || 'Raw';
    if (!actLeadsMap[act]) actLeadsMap[act] = {leadTotal:0, mql:0, sql:0, lost:0};
    actLeadsMap[act].leadTotal++;

    if (['SQL','商机推进','报价与谈判','成交签约'].includes(stage)) actLeadsMap[act].sql++;
    if (stage==='流失/回收') actLeadsMap[act].lost++;
  });
  const actFupMap = {};
  filteredFups.forEach(r => {
    const lid = r[1] ? r[1].trim() : '';
    const lead = leadMap[lid];
    const act = lead ? (lead[2] || '未知') : '未关联';
    const change = r[11] || '未填写';
    if (!actFupMap[act]) actFupMap[act] = {fupTotal:0, pending:0, demand:0};
    actFupMap[act].fupTotal++;
    if (['待跟进','未联系上','未填写'].includes(change)) actFupMap[act].pending++;
    if (change === '有采购需求') actFupMap[act].demand++;
  });
  const actAllKeys = new Set([...Object.keys(actLeadsMap), ...Object.keys(actFupMap)]);
  const actMap = {};
  actAllKeys.forEach(act => {
    const al = actLeadsMap[act] || {leadTotal:0, mql:0, sql:0, lost:0};
    const af = actFupMap[act] || {fupTotal:0, pending:0, demand:0};
    actMap[act] = Object.assign({}, al, af);
  });

  // ===== 流失原因细分（基于跟进记录数据） =====
  const lostLeadIds = new Set(leadsData.filter(r=>r[11]==='流失/回收').map(r=>r[0].trim()));
  const lostReasonMap = {};

let leadFilterStage = '', leadFilterSales = '', leadFilterId = '', leadFilterSource = '', leadFilterRegion = '', leadFilterScale = '', leadFilterKeyword = '';

function clearLeadFilters() {
  leadFilterStage = ''; leadFilterSales = ''; leadFilterId = '';
  leadFilterSource = ''; leadFilterRegion = ''; leadFilterScale = ''; leadFilterKeyword = '';
  renderLeads();
}

function renderLeads() {
  let filtered = leadsData;
  if (leadFilterStage) filtered = filtered.filter(r => (r[11]||'Raw') === leadFilterStage);
  if (leadFilterSales) filtered = filtered.filter(r => r[13] === leadFilterSales);
  if (leadFilterSource) filtered = filtered.filter(r => r[1] === leadFilterSource);
  if (leadFilterScale) filtered = filtered.filter(r => (r[10]||'') === leadFilterScale);
  if (leadFilterId) filtered = filtered.filter(r => r[0] && r[0].toLowerCase().includes(leadFilterId.toLowerCase()));
  if (leadFilterRegion) filtered = filtered.filter(r => r[9] && r[9].includes(leadFilterRegion));
  if (leadFilterKeyword) {
    const kw = leadFilterKeyword.toLowerCase();
    filtered = filtered.filter(r => {
      const fields = [r[2],r[3],r[4],r[5],r[8],r[16]].join(' ').toLowerCase();
      return fields.includes(kw);
    });
  }
  // Build region list from data

  const filterHtml = `

  <label>来源：</label><select onchange="leadFilterSource=this.value;renderLeads()">

  </select>
  <label>阶段：</label><select onchange="leadFilterStage=this.value;renderLeads()">
    <option value="">全部</option>${STAGE_OPTIONS.map(s=>`<option value="${s}" ${leadFilterStage===s?'selected':''}>${s}</option>`).join('')}
  </select>
  <label>销售：</label><select onchange="leadFilterSales=this.value;renderLeads()">
    <option value="">全部</option>${SALES_LIST.map(s=>`<option value="${s}" ${leadFilterSales===s?'selected':''}>${s}</option>`).join('')}
  </select>
  <label>规模：</label><select onchange="leadFilterScale=this.value;renderLeads()">
    <option value="">全部</option>${SCALE_OPTIONS.map(s=>`<option value="${s}" ${leadFilterScale===s?'selected':''}>${s}</option>`).join('')}

  <label>编号：</label><input value="${h(leadFilterId)}" oninput="leadFilterId=this.value;renderLeads()" placeholder="线索编号" style="width:120px">
  <label>关键词：</label><input value="${h(leadFilterKeyword)}" oninput="leadFilterKeyword=this.value;renderLeads()" placeholder="客户/联系人/活动/备注" style="width:160px">
  <button class="small" onclick="clearLeadFilters()" title="清除所有筛选">重置</button>
  <span style="font-size:11px;color:var(--text3)">显示 ${filtered.length} / ${leadsData.length} 条</span>
</div>`;

  const rows = filtered.map((r) => {
    const stage = r[11] || 'Raw';
    const origIdx = leadsData.indexOf(r);
    const badge = stage==='MQL'?'badge-mql':(stage==='Raw'?'badge-raw':(['SQL','商机推进','报价与谈判'].includes(stage)?'badge-sql':(stage==='成交签约'?'badge-won':'badge-lost')));
    // System columns (0-16) with specific rendering
    let tds = `<tr data-row="${origIdx}" data-id="${h(r[0]||'')}">
      <td class="editable" data-col="0">${h(r[0]||'')}</td>
      <td class="editable" data-col="1" data-type="select" data-options="${SOURCE_OPTIONS.join(',')}">${h(r[1]||'')}</td>
      <td class="editable" data-col="2">${h(r[2]||'')}</td>
      <td class="editable" data-col="3">${h(r[3]||'')}</td>
      <td class="editable" data-col="4">${h(r[4]||'')}</td>
      <td class="editable" data-col="5">${h(r[5]||'')}</td>

  // Header with column management buttons
  const headerHtml = LEADS_HEADERS.map((hd, i) => {

  const html = filterHtml + `

  <button class="small" onclick="addColumn('leads')" title="指定位置添加新列">+ 添加列</button>

function renderFlowChart() {
  let html = '<div class="flow-wrap">';
  html += '<div class="ed-hint">✏️ 所有文字均可点击直接编辑，修改后点击右上角"保存"按钮即可持久化</div>';
  html += '<h2 contenteditable="true" data-fp="title">' + h(flowTitle) + '</h2>';
  html += '<div class="sub" contenteditable="true" data-fp="subtitle" style="margin-bottom:12px">' + h(flowSubtitle) + '</div>';
  html += '<div class="flow">';

  let lastPhase = '';
  flowStages.forEach((s, i) => {
    if (s.phase !== lastPhase) {
      const ph = flowPhases.find(p => p.name.startsWith(s.phase)) || flowPhases[0];
      html += '<div class="phase-head"><span class="phase-dot" style="background:' + h(ph.color) + '"></span><span class="phase-name" contenteditable="true" data-fp="phases.' + flowPhases.indexOf(ph) + '.name">' + h(ph.name) + '</span></div>';
      lastPhase = s.phase;
    }
    html += '<div class="stage">'
      + '<div class="stage-num" style="background:' + h(s.numBg) + '">' + h(s.num) + '</div>'
      + '<div class="stage-card" style="border-left-color:' + h(s.border) + '">'
      + '<div class="stg-title" contenteditable="true" data-fp="stages.' + i + '.title">' + h(s.title) + '</div>'
      + '<div class="flow-row"><span class="lbl">负责部门</span><span class="val" contenteditable="true" data-fp="stages.' + i + '.dept">' + h(s.dept) + '</span></div>'
      + '<div class="flow-row"><span class="lbl">关键动作</span><span class="val" contenteditable="true" data-fp="stages.' + i + '.action">' + h(s.action) + '</span></div>'
      + '<div class="flow-row"><span class="lbl">转化标准</span><span class="val" contenteditable="true" data-fp="stages.' + i + '.std">' + h(s.std) + '</span></div>'
      + '<div class="flow-row"><span class="lbl">时效 SLA</span><span class="val" contenteditable="true" data-fp="stages.' + i + '.sla">' + h(s.sla) + '</span></div>'
      + '<div class="flow-row"><span class="lbl">平均周期</span><span class="val" contenteditable="true" data-fp="stages.' + i + '.cycle">' + h(s.cycle) + '</span></div>'
      + '</div></div>';
  });

  html += '<div class="flow-branch">'
    + '<div class="stg-title">流失 / 回收分支（Lost &amp; Recycle）</div>';
  flowBranch.forEach((b, i) => {
    html += '<div class="flow-row"><span class="lbl">' + h(b.label) + '</span><span class="val" contenteditable="true" data-fp="branch.' + i + '.val">' + h(b.val) + '</span></div>';
  });
  html += '</div>';

  html += '<div class="flow-legend">'
    + '<span><i style="background:#378ADD"></i>获取期</span>'
    + '<span><i style="background:#7F77DD"></i>评估期</span>'
    + '<span><i style="background:#1D9E75"></i>转化期</span>'
    + '<span><i style="background:#639922"></i>成交期</span>'
    + '<span><i style="background:#BA7517"></i>流失回收</span>'
    + '</div></div>';
  html += '<div class="flow-foot" contenteditable="true" data-fp="footer">' + h(flowFooter) + '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

// Collect edits from flowchart DOM back to data
function collectFlowEdits() {
  document.querySelectorAll('[data-fp]').forEach(el => {
    const path = el.dataset.fp;
    const parts = path.split('.');
    let obj;
    if (parts[0] === 'stages') obj = flowStages[parseInt(parts[1])];
    else if (parts[0] === 'phases') obj = flowPhases[parseInt(parts[1])];
    else if (parts[0] === 'branch') obj = flowBranch[parseInt(parts[1])];
    else if (parts[0] === 'title') { flowTitle = el.textContent.trim(); return; }
    else if (parts[0] === 'subtitle') { flowSubtitle = el.textContent.trim(); return; }
    else if (parts[0] === 'footer') { flowFooter = el.textContent.trim(); return; }
    if (obj && parts[2]) obj[parts[2]] = el.textContent.trim();
  });
}

    + '<div class="total-val" contenteditable="true" data-mp="totalVal">' + h(mqlTotalVal) + '</div>'
    + '<div class="total-lbl" contenteditable="true" data-mp="totalLbl">' + h(mqlTotalLbl) + '</div>'
    + '<div class="total-hint" contenteditable="true" data-mp="totalHint">' + h(mqlTotalHint) + '</div>'
    + '</div>';

  // Each dimension
  mqlDimensions.forEach((dim, di) => {
    const sub = dim.items.reduce((s, i) => s + (parseInt(i.score) || 0), 0);
    html += '<div class="mql-dim">'
      + '<div class="mql-dim-head" style="border-left:3px solid ' + h(dim.color) + '">'
      + '<span class="dim-icon" contenteditable="true" data-mp="dim.' + di + '.icon">' + h(dim.icon) + '</span>'
      + '<span contenteditable="true" data-mp="dim.' + di + '.name">' + h(dim.name) + '</span>'
      + '<span class="dim-score">小计 ' + sub + ' 分</span>'
      + '</div>'
      + '<table class="mql-table"><thead><tr><th>评分项</th><th style="width:60px">分值</th><th>说明</th></tr></thead><tbody>';
    dim.items.forEach((it, ii) => {
      html += '<tr>'
        + '<td contenteditable="true" data-mp="dim.' + di + '.item.' + ii + '.item">' + h(it.item) + '</td>'
        + '<td class="score-cell" contenteditable="true" data-mp="dim.' + di + '.item.' + ii + '.score">' + h(it.score) + '</td>'
        + '<td contenteditable="true" data-mp="dim.' + di + '.item.' + ii + '.note">' + h(it.note) + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  });

  // Scoring tiers note — render with line breaks
  const noteLines = mqlNote.split('\n');
  html += '<div class="mql-note" contenteditable="true" data-mp="note" style="white-space:pre-line">';
  noteLines.forEach(line => { html += h(line) + '\n'; });
  html += '</div>';

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// Collect edits from MQL DOM back to data
function collectMQLEdits() {
  document.querySelectorAll('[data-mp]').forEach(el => {
    const path = el.dataset.mp;
    const parts = path.split('.');
    if (parts[0] === 'title') { mqlTitle = el.textContent.trim(); return; }
    if (parts[0] === 'subtitle') { mqlSubtitle = el.textContent.trim(); return; }
    if (parts[0] === 'totalVal') { mqlTotalVal = el.textContent.trim(); return; }
    if (parts[0] === 'totalLbl') { mqlTotalLbl = el.textContent.trim(); return; }
    if (parts[0] === 'totalHint') { mqlTotalHint = el.textContent.trim(); return; }
    if (parts[0] === 'note') { mqlNote = el.textContent.trim(); return; }
    if (parts[0] === 'dim') {
      const di = parseInt(parts[1]);
      const dim = mqlDimensions[di];
      if (!dim) return;
      if (parts[2] === 'icon') { dim.icon = el.textContent.trim(); return; }
      if (parts[2] === 'name') { dim.name = el.textContent.trim(); return; }
      if (parts[2] === 'item') {
        const ii = parseInt(parts[3]);
        const item = dim.items[ii];
        if (!item) return;
        if (parts[4] === 'item') item.item = el.textContent.trim();
        else if (parts[4] === 'score') item.score = el.textContent.trim();
        else if (parts[4] === 'note') item.note = el.textContent.trim();
      }
    }
  });
}

function confirmAddColumn(tab) {

function removeColumn(tab, colIdx) {
  const headers = tab === 'leads' ? LEADS_HEADERS : FUP_HEADERS;
  const systemCols = tab === 'leads' ? LEADS_SYSTEM_COLS : FUP_SYSTEM_COLS;
  const colName = headers[colIdx];

    LEADS_HEADERS.splice(colIdx, 1);

  } else {
    FUP_HEADERS.splice(colIdx, 1);
    fupsData.forEach(r => { r.splice(colIdx, 1); });
  }
  markDirty();
  render();
  toast('已删除列「' + colName + '」，请点击保存', 'info');
}

// ============================================================
// 编辑功能
// ============================================================
function bindEditEvents() {
  document.querySelectorAll('.editable').forEach(td => {
    td.addEventListener('click', function(e) {
      if (editingCell) return;
      if (e.shiftKey && selAnchor && selAnchor.td !== this) {
        // Shift+click → 扩展矩形选区
        e.preventDefault();
        selectRange(selAnchor, this);
      } else {
        // 普通点击 → 记录锚点 + 开始编辑
        clearRangeSelection();
        selAnchor = getCellInfo(this);
        startEdit(this);
      }
    });
    // 防止 mousedown 触发其他行为
    td.addEventListener('mousedown', function(e) {
      if (e.shiftKey && selAnchor && selAnchor.td !== this) {
        e.preventDefault();
      }
    });
  });
  // 绑定表头编辑事件
  bindHeaderEditEvents();
}

// ---- 表头编辑 ----
function bindHeaderEditEvents() {
  document.querySelectorAll('.th-edit').forEach(function(el) {
    el.addEventListener('blur', function() {
      var tab = this.dataset.tab;
      var col = parseInt(this.dataset.col);
      var newVal = this.textContent.trim();
      if (isNaN(col)) return;
      if (tab === 'leads') {
        if (LEADS_HEADERS[col] !== newVal) {
          LEADS_HEADERS[col] = newVal;
          markDirty();
          scheduleAutoSync();
        }
      } else if (tab === 'followups') {
        if (FUP_HEADERS[col] !== newVal) {
          FUP_HEADERS[col] = newVal;
          markDirty();
          scheduleAutoSync();
        }
      }
    });
    // 按 Enter 结束编辑
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        this.blur();
      }
    });
    // 阻止点击表头时触发表格排序等行为
    el.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  });
}

// ---- 选区辅助 ----
function getCellInfo(td) {
  var tr = td.closest('tr');
  var row = tr ? parseInt(tr.dataset.row) : -1;
  var col = parseInt(td.dataset.col);
  return { td: td, row: row, col: col };
}

function clearRangeSelection() {
  selRange = null;
  document.querySelectorAll('.range-selected,.range-anchor').forEach(function(td) {
    td.classList.remove('range-selected','range-anchor');
  });
}

function selectRange(anchor, endTd) {
  clearRangeSelection();
  var a = getCellInfo(anchor.td || anchor);
  var b = getCellInfo(endTd);
  if (a.row < 0 || b.row < 0) return;

  // 归一化
  var r1 = Math.min(a.row, b.row), r2 = Math.max(a.row, b.row);
  var c1 = Math.min(a.col, b.col), c2 = Math.max(a.col, b.col);
  selRange = { r1: r1, c1: c1, r2: r2, c2: c2 };

  // 高亮选区
  var tbody = a.td.closest('tbody');
  if (!tbody) return;
  var rows = tbody.querySelectorAll('tr');
  rows.forEach(function(tr) {
    var row = parseInt(tr.dataset.row);
    if (isNaN(row) || row < r1 || row > r2) return;
    tr.querySelectorAll('.editable').forEach(function(td) {
      var col = parseInt(td.dataset.col);
      if (!isNaN(col) && col >= c1 && col <= c2) {
        if (row === a.row && col === a.col) td.classList.add('range-anchor');
        else td.classList.add('range-selected');
      }
    });
  });
  toast('已选中 ' + (r2-r1+1) + ' x ' + (c2-c1+1) + ' 区域', 'info');
}

function batchCopyRange() {
  if (!selRange) return;
  var src = getSourceArray();
  if (!src) return;
  var lines = [];
  for (var r = selRange.r1; r <= selRange.r2; r++) {
    if (!src[r]) continue;
    var cols = [];
    for (var c = selRange.c1; c <= selRange.c2; c++) {
      cols.push((src[r][c] || '').replace(/\t/g, ' '));
    }
    lines.push(cols.join('\t'));
  }
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      toast('已复制 ' + (selRange.r2-selRange.r1+1) + 'x' + (selRange.c2-selRange.c1+1) + ' 区域', 'info');
    });
  }
}

function batchPasteRange(text) {
  if (!selAnchor) return;
  var anchor = selAnchor;
  var src = getSourceArray();
  if (!src) return;

  // 解析 TSV
  var rows = text.split(/\r?\n/);
  if (rows.length && rows[rows.length-1] === '') rows.pop(); // 去掉末尾空行
  var data = rows.map(function(r) { return r.split('\t'); });
  if (!data.length) return;

  var pasteCount = 0;
  for (var ri = 0; ri < data.length; ri++) {
    var targetRow = anchor.row + ri;
    if (targetRow >= src.length) break;
    for (var ci = 0; ci < data[ri].length; ci++) {
      var targetCol = anchor.col + ci;
      if (targetCol >= src[targetRow].length) break;
      var oldVal = src[targetRow][targetCol];
      var newVal = data[ri][ci];
      if (newVal !== oldVal) {
        src[targetRow][targetCol] = newVal;
        pasteCount++;
      }
    }
  }

  if (pasteCount > 0) { markDirty(); saveData(); scheduleAutoSync(); render(); }
  toast('已粘贴 ' + data.length + 'x' + (data[0] ? data[0].length : 0) + ' 区域', 'info');
}

function batchClearRange() {
  if (!selRange) return;
  var src = getSourceArray();
  if (!src) return;
  var count = 0;
  for (var r = selRange.r1; r <= selRange.r2; r++) {
    if (!src[r]) continue;
    for (var c = selRange.c1; c <= selRange.c2; c++) {
      if (src[r][c] !== '' && src[r][c] !== undefined && src[r][c] !== null) {
        src[r][c] = '';
        count++;
      }
    }
  }
  if (count > 0) { markDirty(); saveData(); scheduleAutoSync(); render(); }
  toast('已清空 ' + count + ' 个单元格', 'info');
}

function getSourceArray() {
  return activeTab === 'leads' ? leadsData : (activeTab === 'followups' ? fupsData : null);
}

// ---- 编辑 ----
function startEdit(td) {
  if (editingCell) finishEdit();
  lastTd = td;
  markSelectedCell(td);
  
  const col = parseInt(td.dataset.col);
  const type = td.dataset.type;
  const curVal = (td.dataset.type === 'select' ? (td.querySelector('.badge')?.textContent || td.textContent) : td.textContent).trim();
  
  editingCell = { td, col, type, oldVal: curVal };
  
  td.classList.add('editing');
  td.innerHTML = '';
  
  if (type === 'select') {
    const options = (td.dataset.options || '').split(',');
    // 当前值不在选项中时，补充到列表头部，避免编辑时丢失原值
    if (curVal && !options.includes(curVal)) {
      options.unshift(curVal);
    }
    const sel = document.createElement('select');
    sel.style.cssText = 'width:100%;height:100%;min-height:26px;background:var(--bg);border:2px solid var(--blue);color:var(--text);font-size:12px;font-family:var(--font);padding:2px 4px;outline:none';
    // 空选项 — 允许用户清空下拉框内容
    var emptyOpt = document.createElement('option');
    emptyOpt.value = ''; emptyOpt.textContent = '— 清空 —';
    sel.appendChild(emptyOpt);
    if (!curVal) emptyOpt.selected = true;
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if (o === curVal) opt.selected = true;
      sel.appendChild(opt);
    });
    td.appendChild(sel);
    sel.focus();
    sel.addEventListener('change', () => finishEdit(sel.value));
    sel.addEventListener('blur', () => setTimeout(() => { if(editingCell?.td===td) finishEdit(sel.value); }, 150));
    sel.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();finishEdit(sel.value);} if(e.key==='Escape'){finishEdit(curVal);} });
  } else {
    const input = document.createElement('input');
    input.value = curVal;
    td.appendChild(input);
    input.focus();
    // 光标放在末尾，方便用 Backspace 逐字删除
    var vlen = input.value.length;
    input.setSelectionRange(vlen, vlen);
    input.addEventListener('blur', () => setTimeout(() => { if(editingCell?.td===td) finishEdit(input.value); }, 150));
    input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();finishEdit(input.value);} if(e.key==='Escape'){finishEdit(curVal);} });
  }
}

function finishEdit(newVal) {
  if (!editingCell) return;
  const { td, col, oldVal, type } = editingCell;
  const tr = td.closest('tr');
  if (!tr) { editingCell = null; return; }

  const rowIdx = parseInt(tr.dataset.row);
  if (isNaN(rowIdx)) { editingCell = null; return; }

  newVal = (newVal || '').trim();
  editingCell = null;

  // Determine which dataset
  let sourceArr;
  if (activeTab === 'leads') sourceArr = leadsData;
  else sourceArr = fupsData;

  if (!sourceArr[rowIdx]) return;
  if (newVal === oldVal) { td.textContent = oldVal; td.classList.remove('editing'); return; }

  sourceArr[rowIdx][col] = newVal;
  markDirty();
  scheduleAutoSync(); // 编辑后自动同步到服务器

  // Update cell display inline — NO full re-render
  td.classList.remove('editing');
  if (type === 'select' && activeTab === 'leads' && col === 11 && newVal) {
    // 阶段列 — 带 badge 样式（空值不显示 badge）
    var bv = newVal;
    var bc = bv==='MQL'?'badge-mql':(bv==='Raw'?'badge-raw':(['SQL','商机推进','报价与谈判'].includes(bv)?'badge-sql':(bv==='成交签约'?'badge-won':'badge-lost')));
    td.innerHTML = '<span class="badge ' + bc + '">' + h(newVal) + '</span>';
  } else {
    td.textContent = newVal;
  }
  updateHeaderStats();

  // 如果当前在数据看板页面，实时刷新看板
  if (activeTab === 'dashboard') {
    renderDashboard();
  }

  // Highlight the row
  tr.classList.add('highlight');
  setTimeout(() => tr.classList.remove('highlight'), 1500);
}

// 创建一条跟进记录（内部辅助函数）
function createFollowupRow(lead) {
  const now = new Date();
  const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const fupNum = String(fupsData.length + 1).padStart(4, '0');
  return [
    'FUP-2026-'+fupNum,                    // 0: 跟进编号
    lead[0] || '',                         // 1: 线索编号
    dateStr,                               // 2: 跟进日期
    '', '', '', '', '', '', '', '',        // 3-11: 空
    '',                                    // 12: 下一步计划
    lead[13] || '',                        // 13: 负责人（从线索池同步）
    ''                                     // 14: 操作
  ];
}

// 手动将指定线索添加到跟进记录
function addToFollowup(rowIdx) {
  const lead = leadsData[rowIdx];
  if (!lead || !lead[0]) { toast('该线索没有线索编号，无法添加', 'err'); return; }
  const leadId = lead[0].trim();
  const existCount = fupsData.filter(r => r[1] && r[1].trim() === leadId).length;
  if (existCount > 0) {
    toast('线索 ' + leadId + ' 已有 ' + existCount + ' 条跟进记录', 'warn');
    return;
  }
  const newRow = createFollowupRow(lead);
  fupsData.push(newRow);
  saveData();
  syncToServer();
  toast('已添加线索 ' + leadId + ' 到跟进记录', 'info');
  renderLeads();
}

// MQL≥60 自动分配：扫描所有线索，将评分≥60且无跟进记录的自动添加
function autoAssignMQL() {
  const candidates = leadsData.filter(r => {
    const score = parseInt(r[12]) || 0;
    const leadId = (r[0] || '').trim();
    if (score < 60) return false;
    if (!leadId) return false;
    const hasFup = fupsData.some(f => f[1] && f[1].trim() === leadId);
    return !hasFup;
  });
  if (candidates.length === 0) {
    toast('没有符合条件的线索（MQL≥60且无跟进记录）', 'info');
    return;
  }
  if (!confirm('发现 ' + candidates.length + ' 条 MQL评分≥60 且无跟进记录的线索，是否全部添加到跟进记录？')) return;
  let added = 0;
  candidates.forEach(lead => {
    const newRow = createFollowupRow(lead);
    fupsData.push(newRow);
    added++;
  });
  saveData();
  syncToServer();
  toast('已自动分配 ' + added + ' 条线索到跟进记录', 'info');
  renderLeads();
}

// ============================================================
// 新增跟进记录
// ============================================================
function addFollowup() {
  if (activeTab !== 'followups' && activeTab !== 'leads') {
    toast('请先切换到"线索池"或"跟进记录"页', 'warn'); return;
  }

  let defLeadId = '';
  let defSales = '';
  if (activeTab === 'leads') {
    const firstEditable = document.querySelector('.editable[data-col="0"]');
    if (firstEditable) defLeadId = firstEditable.textContent.trim();
    const salesEl = document.querySelector('.editable[data-col="13"]');
    if (salesEl) defSales = salesEl.textContent.trim();
  }

  // 检查该线索是否已有跟进记录
  if (defLeadId) {
    const existCount = fupsData.filter(r => r[1] && r[1].trim() === defLeadId.trim()).length;
    if (existCount > 0) {
      if (!confirm(`线索 ${defLeadId} 已有 ${existCount} 条跟进记录，确定要再新增一条吗？\n\n建议在已有跟进记录上直接修改跟进内容和阶段变化。`)) {
        return;
      }
    }
  }

  if (!defLeadId && activeTab === 'leads') {
    toast('请先在表格中选中一条线索', 'warn'); return;
  }

  const now = new Date();
  const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const fupNum = String(fupsData.length + 1).padStart(4, '0');

  const newRow = [
    `FUP-2026-${fupNum}`,
    defLeadId,
    dateStr,
    '', '', '', '', '', '', '', '', '', '',
    defSales
  ];

  fupsData.push(newRow);
  saveData();
  scheduleAutoSync();
  toast('新增跟进记录: ' + newRow[0], 'info');
  switchTab('followups');

  if (defLeadId) {
    const lead = leadsData.find(l => l[0] && l[0].trim() === defLeadId.trim());
    if (lead && (lead[11] || 'Raw') === 'Raw') {
      lead[11] = 'MQL';
      saveData();
    }
  }
}

// CSV 解析器（支持引号、逗号、换行）
function _parseCSV(text, delimiter) {
  if (!delimiter) {
    var tCount = (text.split('\n')[0] || '').split('\t').length;
    var cCount = (text.split('\n')[0] || '').split(',').length;
    delimiter = tCount > cCount ? '\t' : ',';
  }
  var rows = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delimiter) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') { /* skip */ }
      else field += ch;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function(r) { return r.some(function(c) { return c && c.trim(); }); });
}

// 处理文件上传
function handleImportFile(input) {
  var file = input.files[0];
  if (!file) return;
  var name = file.name.toLowerCase();
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    // Excel — 动态加载 SheetJS
    if (typeof XLSX === 'undefined') {
      var scr = document.createElement('script');
      scr.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      scr.onload = function() { _readExcel(file); };
      scr.onerror = function() { toast('无法加载Excel解析库，请改用CSV格式上传', 'err'); };
      document.head.appendChild(scr);
    } else {
      _readExcel(file);
    }
  } else {
    // CSV / TXT
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      // BOM 处理
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var parsed = _parseCSV(text);
      _processImportedData(parsed);
    };
    reader.readAsText(file, 'UTF-8');
  }
}

function _readExcel(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var parsed = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      _processImportedData(parsed);
    } catch(err) {
      toast('Excel解析失败: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

// 处理粘贴
function handleImportPaste(text) {
  if (!text || !text.trim()) {
    document.getElementById('imp_preview').style.display = 'none';
    document.getElementById('imp_confirm').disabled = true;
    return;
  }
  var parsed = _parseCSV(text);
  _processImportedData(parsed);
}

// 处理解析后的数据
function _processImportedData(parsed) {
  if (!parsed || parsed.length < 2) {
    toast('数据不足：至少需要表头行 + 1行数据', 'warn');
    document.getElementById('imp_preview').style.display = 'none';
    document.getElementById('imp_confirm').disabled = true;
    return;
  }
  var importHeaders = parsed[0].map(function(s) { return String(s || '').trim(); });
  var importRows = parsed.slice(1).map(function(r) {
    var row = [];
    for (var i = 0; i < importHeaders.length; i++) row.push(r[i] != null ? String(r[i]) : '');
    return row;
  });

  var targetHeaders = _importState.target === 'leads' ? LEADS_HEADERS : FUP_HEADERS;

  // 自动映射：按列名匹配
  var mapping = importHeaders.map(function(ih) {
    var idx = targetHeaders.findIndex(function(th) { return th === ih || th.replace(/\(.*\)/,'').trim() === ih.replace(/\(.*\)/,'').trim(); });
    return idx >= 0 ? idx : -1;
  });

  _importState.headers = importHeaders;
  _importState.rows = importRows;
  _importState.mapping = mapping;

  _updateImportPreview();
}

function _updateImportPreview() {
  if (_importState.target) {
    var targetHeaders = _importState.target === 'leads' ? LEADS_HEADERS : FUP_HEADERS;
    // 重新映射
    _importState.mapping = _importState.headers.map(function(ih) {
      var idx = targetHeaders.findIndex(function(th) { return th === ih || th.replace(/\(.*\)/,'').trim() === ih.replace(/\(.*\)/,'').trim(); });
      return idx >= 0 ? idx : -1;
    });
  }
  if (!_importState.rows.length) return;

  var targetHeaders = _importState.target === 'leads' ? LEADS_HEADERS : FUP_HEADERS;
  var mappedCount = _importState.mapping.filter(function(m) { return m >= 0; }).length;
  var unmapped = _importState.headers.filter(function(ih, i) { return _importState.mapping[i] < 0; });

  // 构建预览表格
  var previewRows = _importState.rows.slice(0, 5);
  var html = '<thead><tr style="background:var(--th-bg)">';
  html += '<th style="padding:4px 6px;text-align:left;border-bottom:1px solid var(--border)">导入列</th>';
  html += '<th style="padding:4px 6px;text-align:left;border-bottom:1px solid var(--border)">→ 映射到</th>';
  html += '</tr></thead><tbody>';
  _importState.headers.forEach(function(ih, i) {
    var mapped = _importState.mapping[i] >= 0 ? targetHeaders[_importState.mapping[i]] : '';
    var color = mapped ? 'var(--green)' : 'var(--text3)';
    var bg = mapped ? '' : 'background:rgba(239,68,68,.05)';
    html += '<tr style="' + bg + '">'
      + '<td style="padding:3px 6px;border-bottom:1px solid var(--border)">' + h(ih) + '</td>'
      + '<td style="padding:3px 6px;border-bottom:1px solid var(--border);color:' + color + '">'
      + (mapped ? '✓ ' + h(mapped) : '<select style="font-size:11px" onchange="_importState.mapping[' + i + ']=this.value>=0?parseInt(this.value):-1;_updateImportPreviewStats()">'
        + '<option value="-1">— 不导入 —</option>'
        + targetHeaders.map(function(th, ti) { return '<option value="' + ti + '">' + h(th) + '</option>'; }).join('')
        + '</select>')
      + '</td></tr>';
  });
  html += '</tbody>';
  // 数据预览
  html += '<thead><tr style="background:var(--th-bg)"><th colspan="2" style="padding:6px;border-bottom:1px solid var(--border);border-top:2px solid var(--border)">数据预览（前5行）</th></tr></thead><tbody>';
  previewRows.forEach(function(row) {
    var firstCell = row[0] || '';
    var secondCell = row[1] || '';
    html += '<tr><td style="padding:3px 6px;border-bottom:1px solid var(--border);color:var(--text2)" colspan="2">' + h(firstCell) + ' | ' + h(secondCell) + (row.length > 2 ? ' | ' + h(row[2]) : '') + ' ...</td></tr>';
  });
  html += '</tbody>';

  var table = document.getElementById('imp_preview_table');
  if (table) table.innerHTML = html;
  document.getElementById('imp_preview').style.display = 'block';
  _updateImportPreviewStats();
}

function _updateImportPreviewStats() {
  var mappedCount = _importState.mapping.filter(function(m) { return m >= 0; }).length;
  var total = _importState.headers.length;
  var stats = document.getElementById('imp_stats');
  if (stats) stats.textContent = '共 ' + _importState.rows.length + ' 行数据 · ' + mappedCount + '/' + total + ' 列已映射';
  document.getElementById('imp_confirm').disabled = mappedCount === 0;
}

function confirmImport() {
  if (!_importState.rows.length) { toast('没有可导入的数据', 'warn'); return; }
  var targetHeaders = _importState.target === 'leads' ? LEADS_HEADERS : FUP_HEADERS;
  var mappedCount = _importState.mapping.filter(function(m) { return m >= 0; }).length;
  if (mappedCount === 0) { toast('请至少映射一列', 'warn'); return; }

  var mode = document.getElementById('imp_mode').value;
  var newData = _importState.rows.map(function(row) {
    var newRow = new Array(targetHeaders.length).fill('');
    _importState.mapping.forEach(function(targetIdx, importIdx) {
      if (targetIdx >= 0 && importIdx < row.length) {
        newRow[targetIdx] = row[importIdx];
      }
    });
    return newRow;
  });

  // 过滤全空行
  newData = newData.filter(function(r) { return r.some(function(c) { return c && c.trim(); }); });

  if (newData.length === 0) { toast('没有有效数据行', 'warn'); return; }

  if (_importState.target === 'leads') {
    if (mode === 'replace') leadsData = [];
    leadsData = leadsData.concat(newData);
  } else {
    if (mode === 'replace') fupsData = [];
    fupsData = fupsData.concat(newData);
  }

  closeImportModal();
  saveData();
  scheduleAutoSync();
  render();
  updateHeaderStats();
  toast('成功导入 ' + newData.length + ' 条数据并已同步', 'info');
}

function h(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function init() {
  // Try localStorage first
  if (!initData()) {
    // Load embedded default data
    loadDefault();
  }
  updateHeaderStats();
  render();

  // 启动后异步从服务器拉取最新数据（不阻塞首屏渲染）
  serverSyncing = true;
  var syncEl0 = document.getElementById('syncStatus');
  if (syncEl0) syncEl0.textContent = '🔄 连接服务器...';
  syncFromServer().then(function(serverUpdated) {
    serverSyncing = false;
    if (serverUpdated) {
      updateHeaderStats();
      render();
      toast('已从服务器同步最新数据', 'info');
    } else if (!_autoSeedDone && leadsData.length > 0) {
      // 服务器无数据，自动推送本地数据作为种子
      _autoSeedDone = true;
      syncToServer();
      toast('已将本地数据同步到服务器', 'info');
    }
  }).catch(function() { serverSyncing = false; });
}
